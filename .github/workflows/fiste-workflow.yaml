name: First workflow
on: push
env:
          FILE_NAME: app2.txt
          TEXT_CONTENT: "hello world"                   
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:         
      - name: Building the app
        run: |
          sleep 1
          echo "Bonjour tout le monde..."
      - name: Building the app
        run: |
          sleep 1
          echo "Actually building app"
  test-job:
    needs: build-job
    runs-on: ubuntu-latest
    concurrency:
      group: group
    steps:
      - name: Test the app
        run: |
          sleep 30000
          echo "testing the app ..."
          
          

